plugins {
    id 'com.android.application'
}

android {
    namespace 'com.joinmoathir.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.joinmoathir.demo'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.0.0-demo'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
